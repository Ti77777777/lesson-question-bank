<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>习题课题库</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./layout.css">
  <link rel="stylesheet" href="./experience.css">
  <link rel="stylesheet" href="./polish.css">
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <a class="brand" href="#/search" aria-label="回到题库">
        <span class="brand-name">习题课题库</span>
      </a>
      <nav class="main-nav" id="main-nav" aria-label="主导航">
        <a href="#/search" data-nav="search">题库</a>
        <a href="#/collections" data-nav="collections">题单</a>
        <a href="#/ai" data-nav="import">导入</a>
        <details class="nav-more"><summary>更多</summary><div>
          <a href="#/releases" data-nav="releases">讲义归档</a>
          <a href="#/usage" data-nav="usage">使用记录</a>
          <a href="#/settings" data-nav="settings">系统信息</a>
        </div></details>
      </nav>
      <div class="bar-right">
        <button type="button" class="btn btn-quiet basket-btn" id="basket-btn">
          选题篮<span class="count mono" id="basket-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="flash" id="flash" role="alert" hidden></div>

  <main id="view" class="view" aria-live="polite"></main>

  <div id="modal-root"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
